name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # vcpkg binary cache in GitHub Actions cache: gtest & co. are built once per runner image.
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # The real target platform: every target, every test.
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Configure
        run: cmake --preset win
        env:
          VCPKG_ROOT: ${{ env.VCPKG_INSTALLATION_ROOT }}
      - name: Build
        run: cmake --build --preset win-debug
      - name: Test
        run: ctest --preset win-debug
      - name: Build (release)
        run: cmake --build --preset win-release
      - name: Audit - no networking imports (DATA-POLICY.md)
        shell: pwsh
        run: ./tools/audit/check-no-network.ps1 -Binary build/win/app/Release/lankey.exe

  # Proves lankey_core (and everything it drags in) has no Win32 dependency, and runs the
  # suite under ASan/UBSan.
  linux-clang:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        preset: [linux-clang, linux-asan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
        env:
          VCPKG_ROOT: ${{ env.VCPKG_INSTALLATION_ROOT }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset == 'linux-asan' && 'linux-asan' || 'linux-debug' }}
      - name: Test
        run: ctest --preset ${{ matrix.preset == 'linux-asan' && 'linux-asan' || 'linux-debug' }}

  format-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: clang-format
        run: |
          git ls-files 'core/*.cpp' 'core/*.h' 'tests/*.cpp' 'tests/*.h' \
            | xargs clang-format --dry-run --Werror
      - name: No Win32 in core
        run: |
          if grep -rniE '#include\s*[<"](windows|winuser|winbase|shellapi|d2d1|dwrite)\.h' core/; then
            echo "core/ must not include Win32 headers"; exit 1
          fi
